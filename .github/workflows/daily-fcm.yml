name: Daily FCM Notifications

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Run at minute 7 every hour (UTC) to avoid top-of-hour congestion.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      type:
        description: Force notification type
        required: false
        default: ''
        type: choice
        options:
          - ''
          - morning
          - night

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install firebase-admin
        run: npm install firebase-admin --no-save

      - name: Debug trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "run_started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Send topic notification
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node .github/scripts/send_fcm_topic.js "${{ github.event.inputs.type }}"
